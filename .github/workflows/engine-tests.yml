name: Harmonic engine tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DHARMONIC_SHADOW_BUILD_TESTS=ON -DHARMONIC_SHADOW_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
