name: Harmonic engine tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DHARMONIC_SHADOW_BUILD_TESTS=ON -DHARMONIC_SHADOW_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-au-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure arm64 AU
        run: >-
          cmake -S . -B build-au
          -DHARMONIC_SHADOW_BUILD_PLUGIN=ON
          -DHARMONIC_SHADOW_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build Logic AU MIDI FX
        run: cmake --build build-au --target HarmonicShadow_AU --config Release --parallel 2
      - name: Ad-hoc sign AU component
        run: codesign --force --deep --sign - "build-au/HarmonicShadow_artefacts/Release/AU/Harmonic Shadow.component"
      - name: Upload arm64 AU component
        uses: actions/upload-artifact@v4
        with:
          name: Harmonic-Shadow-AU-arm64
          path: build-au/HarmonicShadow_artefacts/Release/AU/Harmonic Shadow.component
          if-no-files-found: error
